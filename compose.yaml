# Local dev server with live reload, running inside the pinned Node image.
#   docker compose up dev        -> http://localhost:4321
services:
  dev:
    build:
      context: .
      target: deps
    # --ignore-lock: Astro records the dev server's PID in a lock file; inside a
    # container PIDs are reused, so a stale lock from a previous run would
    # otherwise be mistaken for a live server.
    command: npx astro dev --host 0.0.0.0 --ignore-lock
    init: true
    ports:
      - "4321:4321"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
